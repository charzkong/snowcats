; Grafana settings: local-only, reached through an SSH tunnel.
[server]
http_addr = 127.0.0.1
http_port = 3000

[paths]
provisioning = /home/ecs-user/services/monitoring/provisioning
; data stays at the default (<homepath>/data). Grafana 13 ships the Prometheus
; data source as a bundled plugin in <homepath>/data/plugins, so moving the data
; folder hides it ("plugin prometheus not found").

[analytics]
reporting_enabled = false
check_for_updates = false
